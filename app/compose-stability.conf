// Glossy — Compose stability configuration.
//
// The Compose compiler only infers a type as stable when it can see the whole
// class, and it never does that for a class from another Gradle module. The
// innertube models are the app's list-row payloads — every song, album,
// playlist, artist and podcast on Home, Library and Search is one — and they
// live in :innertube, which has no Compose dependency and so cannot carry an
// @Immutable annotation.
//
// Without this file those types are unstable, which means every composable that
// takes one is unskippable: a LazyColumn re-runs its rows on any state change
// that reaches it — scroll, playback state, palette, a preference — instead of
// skipping the rows whose arguments did not change. On a long library list that
// is the app's single largest source of needless recomposition.
//
// Every class below is a plain `data class` of `val`s (or, for YTItem, a sealed
// class of abstract `val`s). Nothing in them is mutated after construction —
// they are rebuilt, never edited — so the promise Compose is being given here
// holds. Adding a class that *can* change after construction would produce
// stale UI, so do not add one without checking.
//
// Format: one fully-qualified class name per line; `//` starts a comment.

com.metrolist.innertube.models.YTItem
com.metrolist.innertube.models.SongItem
com.metrolist.innertube.models.AlbumItem
com.metrolist.innertube.models.PlaylistItem
com.metrolist.innertube.models.ArtistItem
com.metrolist.innertube.models.PodcastItem
com.metrolist.innertube.models.EpisodeItem
com.metrolist.innertube.models.Artist
com.metrolist.innertube.models.Album
