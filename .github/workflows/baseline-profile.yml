name: Generate Baseline Profiles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-baseline-profile:
    name: Generate Baseline Profiles (${{ matrix.variant }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gms
            variantName: Gms
          - variant: foss
            variantName: Foss
          - variant: izzy
            variantName: Izzy

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages required by Glossy
        run: sdkmanager --install "build-tools;35.0.0"

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Generate Default Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify Android SDK
        run: |
          adb version
          sdkmanager --list_installed
          test -f "$HOME/.android/debug.keystore"

      - name: Generate Baseline Profile on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Match the known-good x86_64 emulator setup used by the reference
          # workflow. The app APK is ARM-only, so the test task must install/run
          # against an emulator image that supports ARM translation where available.
          api-level: 33
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          # Avoid the action's animation-disable command; some images report
          # "Can't find service: input" for adb shell input.
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb devices
            ./gradlew :baselineprofile:connected${{ matrix.variantName }}NonMinifiedReleaseAndroidTest --stacktrace

      # saveInSrc=true writes the collected rules to app/src/<variant>/generated/baselineProfiles.
      # Commit only this matrix variant's generated source profile; retry pushes because
      # the three variants run in parallel and may update the same branch concurrently.
      - name: Commit generated Baseline Profile to source
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          PROFILE_DIR="app/src/${VARIANT}/generated/baselineProfiles"
          echo "Checking generated source profiles in ${PROFILE_DIR}"
          if [[ ! -d "$PROFILE_DIR" ]] || ! find "$PROFILE_DIR" -maxdepth 1 -type f -name '*.txt' -print -quit | grep -q .; then
            echo "No generated source profile found in ${PROFILE_DIR}; refusing to silently skip profile persistence." >&2
            find app/src -type f -path '*baselineProfiles/*.txt' -print || true
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PROFILE_DIR"/*.txt
          if git diff --cached --quiet; then
            echo "Generated profile is unchanged; no source commit needed."
            exit 0
          fi
          git commit -m "Update ${VARIANT} Baseline Profile"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Generated profile committed to ${GITHUB_REF_NAME}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing on latest branch before retry."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep 2
          done
          echo "Could not push generated profile after retries." >&2
          exit 1

      - name: Build release variant
        run: |
          ./gradlew :app:assemble${{ matrix.variantName }}Release --stacktrace
        env:
          GLOSSY_APPLICATION_ID: com.jay.glossy
          GLOSSY_APP_NAME: Glossy Nightly
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Verify Baseline Profile is packaged
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "app/build/outputs/apk/${{ matrix.variant }}/release" -type f -name "*.apk" ! -name "*-signed.apk")
          VERIFIED=false
          for APK in "${APKS[@]}"; do
            if unzip -l "$APK" | grep -q 'assets/dexopt/baseline.prof'; then
              echo "Verified assets/dexopt/baseline.prof in $APK"
              VERIFIED=true
              break
            fi
          done
          if [[ "$VERIFIED" != "true" ]]; then
            echo "No APK in app/build/outputs/apk/${{ matrix.variant }}/release contains assets/dexopt/baseline.prof" >&2
            exit 1
          fi

      - name: Sign Release APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile-${{ matrix.variant }}
          path: |
            app/build/outputs/apk/**
            app/build/outputs/mapping/**
            app/src/**/baselineProfiles/*.txt
            app/src/**/generated/baselineProfiles/*.txt
            baselineprofile/build/outputs/**
          if-no-files-found: warn
          retention-days: 14
