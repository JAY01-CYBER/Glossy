name: Generate Baseline Profiles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-baseline-profile:
    name: Generate Baseline Profiles (${{ matrix.variant }})
    runs-on: macos-13

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gms
            variantName: Gms
          - variant: foss
            variantName: Foss
          - variant: izzy
            variantName: Izzy

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages required by Glossy
        run: sdkmanager --install "build-tools;35.0.0"

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Generate Default Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify Android SDK
        run: |
          adb version
          sdkmanager --list_installed
          test -f "$HOME/.android/debug.keystore"

      - name: Generate Baseline Profile on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb devices
            ./gradlew :app:generate${{ matrix.variantName }}ReleaseBaselineProfile --stacktrace

      - name: Prepare generated Baseline Profile
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          SOURCE_DIR="app/src/${VARIANT}/generated/baselineProfiles"
          STANDARD_DIR="app/src/${VARIANT}/baselineProfiles"
          PROFILE=""

          for DIR in "$SOURCE_DIR" "$STANDARD_DIR"; do
            if [[ -d "$DIR" ]]; then
              PROFILE="$(find "$DIR" -maxdepth 1 -type f -name '*.txt' -size +0c -print -quit)"
              [[ -n "$PROFILE" ]] && break
            fi
          done

          if [[ -z "$PROFILE" ]]; then
            PROFILE="$(find baselineprofile/build app/build -type f -name '*.txt' -size +0c \
              \( -iname '*baseline*' -o -iname '*prof*' \) -print 2>/dev/null | head -n 1 || true)"
          fi

          if [[ -z "$PROFILE" ]]; then
            echo "No non-empty Baseline Profile text file found for ${VARIANT}." >&2
            echo "Diagnostic profile-related files:"
            find app/src app/build baselineprofile/build -type f \
              \( -iname '*baseline*' -o -iname '*prof*' \) -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$SOURCE_DIR"
          cp "$PROFILE" "$SOURCE_DIR/baseline-prof.txt"
          test -s "$SOURCE_DIR/baseline-prof.txt"
          echo "Prepared profile from $PROFILE at $SOURCE_DIR/baseline-prof.txt"
          head -n 3 "$SOURCE_DIR/baseline-prof.txt"

      - name: Upload source Baseline Profile
        uses: actions/upload-artifact@v4
        with:
          name: source-baseline-profile-${{ matrix.variant }}
          path: app/src/${{ matrix.variant }}/generated/baselineProfiles/baseline-prof.txt
          if-no-files-found: error
          retention-days: 3

      - name: Build release variant
        run: |
          ./gradlew :app:assemble${{ matrix.variantName }}Release --stacktrace
        env:
          GLOSSY_APPLICATION_ID: com.jay.glossy
          GLOSSY_APP_NAME: Glossy Nightly
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Verify Baseline Profile is packaged
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "app/build/outputs/apk/${{ matrix.variant }}/release" -type f -name "*.apk" ! -name "*-signed.apk")
          VERIFIED=false
          for APK in "${APKS[@]}"; do
            if unzip -l "$APK" | grep -q 'assets/dexopt/baseline.prof'; then
              echo "Verified assets/dexopt/baseline.prof in $APK"
              VERIFIED=true
              break
            fi
          done
          if [[ "$VERIFIED" != "true" ]]; then
            echo "No APK in app/build/outputs/apk/${{ matrix.variant }}/release contains assets/dexopt/baseline.prof" >&2
            exit 1
          fi

      - name: Sign Release APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile-${{ matrix.variant }}
          path: |
            app/build/outputs/apk/**
            app/build/outputs/mapping/**
            app/src/**/baselineProfiles/*.txt
            app/src/**/generated/baselineProfiles/*.txt
            baselineprofile/build/outputs/**
          if-no-files-found: warn
          retention-days: 14

  persist-baseline-profiles:
    name: Commit generated Baseline Profiles
    needs: generate-baseline-profile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Download FOSS Baseline Profile
        uses: actions/download-artifact@v4
        with:
          name: source-baseline-profile-foss
          path: downloaded-profiles/foss

      - name: Download GMS Baseline Profile
        uses: actions/download-artifact@v4
        with:
          name: source-baseline-profile-gms
          path: downloaded-profiles/gms

      - name: Download Izzy Baseline Profile
        uses: actions/download-artifact@v4
        with:
          name: source-baseline-profile-izzy
          path: downloaded-profiles/izzy

      - name: Commit all generated Baseline Profiles once
        shell: bash
        run: |
          set -euo pipefail
          for VARIANT in foss gms izzy; do
            PROFILE="downloaded-profiles/${VARIANT}/baseline-prof.txt"
            DEST="app/src/${VARIANT}/generated/baselineProfiles/baseline-prof.txt"
            if [[ ! -s "$PROFILE" ]]; then
              echo "Missing or empty profile artifact: $PROFILE" >&2
              exit 1
            fi
            mkdir -p "$(dirname "$DEST")"
            cp "$PROFILE" "$DEST"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/foss/generated/baselineProfiles/baseline-prof.txt app/src/gms/generated/baselineProfiles/baseline-prof.txt app/src/izzy/generated/baselineProfiles/baseline-prof.txt

          if git diff --cached --quiet; then
            echo "Generated Baseline Profiles are unchanged; no commit needed."
            exit 0
          fi

          git commit -m "Update generated Baseline Profiles"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "All generated Baseline Profiles committed to ${GITHUB_REF_NAME}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; fetching and rebasing."
            git fetch origin "${GITHUB_REF_NAME}"
            git -c rebase.autoStash=true rebase "origin/${GITHUB_REF_NAME}"
            sleep 2
          done
          echo "Could not push Baseline Profiles after retries." >&2
          exit 1
