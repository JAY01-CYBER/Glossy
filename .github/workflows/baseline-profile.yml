name: Generate Baseline Profiles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-baseline-profile:
    name: Generate Baseline Profiles (${{ matrix.variant }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant: [gms, foss]

    steps:
      # Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Set up JDK 21
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages required by Glossy
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # Prepare Gradle
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # Generate the default Android debug keystore.
      # Required because the Gradle debug signing configuration
      # expects ~/.android/debug.keystore on a fresh GitHub runner.
      - name: Generate Default Debug Keystore
        run: |
          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Verify Android SDK
      - name: Verify Android SDK
        run: |
          adb version
          sdkmanager --list_installed
          test -f "$HOME/.android/debug.keystore"

      # Generate Baseline Profiles
      - name: Run Baseline Profile generation
        run: |
          ./gradlew \
            :baselineprofile:connected${{ matrix.variant == 'gms' && 'Gms' || 'Foss' }}NonMinifiedReleaseAndroidTest \
            --stacktrace

      # Build the selected release variant
      - name: Build release variant
        run: |
          ./gradlew \
            :app:assemble${{ matrix.variant == 'gms' && 'Gms' || 'Foss' }}Release \
            --stacktrace
        env:
          GLOSSY_APPLICATION_ID: com.jay.glossy
          GLOSSY_APP_NAME: Glossy Nightly
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      # Sign the generated release APK using existing repository secrets
      - name: Sign Release APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      # Upload APKs, mappings, and generated profile outputs
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile-${{ matrix.variant }}
          path: |
            app/build/outputs/apk/**
            app/build/outputs/mapping/**
            app/src/**/baseline-prof.txt
            baselineprofile/build/outputs/**
          if-no-files-found: warn
          retention-days: 14
