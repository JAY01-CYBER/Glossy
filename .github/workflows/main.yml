name: Build Executable

on:
  workflow_dispatch: # Allows manual run from GitHub Actions tab
  push:
    tags:
      - 'v*' # Triggers on semantic version tags like v1.0.0

jobs:
  build:
    runs-on: windows-latest # PyInstaller compiles to target OS; use Windows to build a .exe

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Change to your required Python version
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # If your project has a requirements.txt, uncomment below:
        # pip install -r requirements.txt
        
        # Install your project or its specific package dependencies if needed
        # pip install .

    - name: Build with PyInstaller
      run: |
        # Replace 'glossy.py' with your main entry point script name.
        # Use '--noconsole' if it's a GUI app, or leave it out if it's a CLI tool.
        # Use '--onefile' to bundle everything into a single standalone .exe
        pyinstaller --onefile --noconsole glossy.py

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: glossy-windows-exe
        path: dist/glossy.exe
