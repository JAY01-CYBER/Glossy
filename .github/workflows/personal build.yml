name: Build Personal APK

on:
  workflow_dispatch: # Triggers manually from the Actions tab

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Temporary Personal Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/personal-release.keystore \
            -storepass androidpassword \
            -alias personaldebugkey \
            -keypass androidpassword \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Glossy Personal,O=Glossy,C=US"

      - name: Build and Sign Release APK
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary
        env:
          GLOSSY_DEBUG_KEYSTORE_PATH: personal-release.keystore
          KEYSTORE_PASSWORD: androidpassword
          KEY_ALIAS: personaldebugkey
          KEY_PASSWORD: androidpassword
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload Signed Personal APK
        uses: actions/upload-artifact@v4
        with:
          name: glossy-signed-personal-apk
          path: app/build/outputs/apk/foss/release/*.apk
